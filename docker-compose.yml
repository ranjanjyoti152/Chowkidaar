# Chowkidar NVR - Docker Compose Configuration
services:
  # PostgreSQL Database with pgvector extension for semantic search
  postgres:
    image: pgvector/pgvector:pg16  # PostgreSQL 16 with pgvector pre-installed
    container_name: chowkidar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chowkidar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chowkidar_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chowkidar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5533:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chowkidar} -d ${POSTGRES_DB:-chowkidar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NOTE: Using external Ollama server at http://192.168.101.66:11434
  # Ollama service removed - using remote server with gemma3:4b model

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chowkidar-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-chowkidar}:${POSTGRES_PASSWORD:-chowkidar_secret}@postgres:5432/${POSTGRES_DB:-chowkidar}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-please}
      - OLLAMA_BASE_URL=http://192.168.100.66:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - YOLO_MODEL=${YOLO_MODEL:-yolov8n.pt}
      - YOLO_DEVICE=${YOLO_DEVICE:-0}
      - DATA_DIR=/data
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data/recordings:/data/recordings
      - ./data/snapshots:/data/snapshotsß
      - ./data/models:/data/models
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chowkidar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    name: chowkidar_postgres

networks:
  default:
    name: chowkidar_network
    driver: bridge
